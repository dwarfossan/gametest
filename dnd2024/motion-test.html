<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>紙娃娃動作測試</title><link rel="stylesheet" href="./css/motion-test.css"></head><body><main><a href="./test.html">← 返回測試主選單</a><header><span> D&D 2024 · 獨立美術測試</span><h1>紙娃娃動作測試</h1><p>使用上傳的木頭底座原圖；在這裡測試與修正，不影響正式戰鬥。</p></header><div class="layout"><section class="panel preview"><div id="stage" data-motion="idle"></div><p id="result" role="status">待機</p></section><section class="panel controls"><h2>外觀與關節</h2><label>體型<select id="body"><option value="tall">高身形</option><option value="dwarf">矮壯身形</option></select></label><label>朝向<select id="face"><option value="-1">原圖朝向</option><option value="1">左右鏡像</option></select></label><label>畫面左臂 <output id="leftValue">0°</output><input id="left" type="range" min="-35" max="35" value="0"></label><label>畫面右臂 <output id="rightValue">0°</output><input id="right" type="range" min="-35" max="35" value="0"></label><h2>播放動作</h2><div id="actions"><button data-motion="idle">待機</button><button data-motion="slash">揮砍</button><button data-motion="block">格擋</button><button data-motion="shoot">射擊</button><button data-motion="cast">施法</button><button data-motion="jump">跳躍</button><button data-motion="hurt">受擊</button></div><div class="tools"><button id="pause">暫停</button><button id="breath">呼吸：開</button><button id="reset">重設</button></div><p class="note">拆件初版：手臂以原圖遮罩分離，動作循環播放供檢查。肩腋與遮擋後缺少的圖像尚未補繪；射擊、施法目前是姿勢測試，尚未掛接武器；跳躍先測上半身位移，腳與底座保持固定。關節滑桿只調整本頁，不保存資料。</p><a href="./assets/paperdoll/source.png" target="_blank" rel="noopener">查看上傳原圖 ↗</a></section></div></main><script type="module" src="./js/ui/motion-test.mjs"></script></body></html>
